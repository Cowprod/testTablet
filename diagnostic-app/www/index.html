<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>Tablet Diagnostic</title>
</head>
<body>
    <div class="app">
        <h1>Tablet Diagnostic</h1>
        <div id="deviceready" class="blink">
            <p class="event listening">Connecting to Device</p>
            <p class="event received">Device is Ready</p>
        </div>
        <div id="error-msg" style="color:#d32f2f;background:#ffebee;padding:8px;margin:8px;border-radius:4px;display:none;font-size:13px;"></div>
        <div id="loading" style="text-align:center;padding:16px;font-size:13px;color:#666;">Collecting diagnostics...</div>
        <div id="report-container" style="display:none;">
            <div id="report-summary"></div>
            <div id="report-details"></div>
            <div id="permissions-section">
                <h2>Permissions</h2>
                <div id="permissions-list"></div>
                <button id="request-permissions-btn" style="padding:10px 20px;margin-top:8px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;">Request Permissions</button>
            </div>
            <div id="json-section">
                <h2>JSON Report</h2>
                <pre id="json-report" style="background:#f5f5f5;padding:8px;border-radius:4px;font-size:11px;overflow-x:auto;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;"></pre>
                <button id="copy-json-btn" style="padding:8px 16px;margin-top:8px;background:#4CAF50;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;">Copy JSON</button>
                <button id="refresh-btn" style="padding:8px 16px;margin-top:8px;background:#2196F3;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;">Refresh</button>
            </div>
        </div>
    </div>
    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
